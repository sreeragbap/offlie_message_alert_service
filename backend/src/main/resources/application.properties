spring.application.name=offline-message-alert-service

# Local development: values can come from backend/.env (git-ignored). In production use real env vars.
spring.config.import=optional:file:.env[.properties]

# --- Database: Supabase PostgreSQL (session pooler or direct connection, TLS required) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
# Refresh connections before the Supabase pooler or the network drops idle ones.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=900000
# Migrations may use a more privileged login than the app (see docs/03-setup-guide.md).
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.flyway.schemas=app
spring.flyway.default-schema=app

# --- Supabase Auth (tokens verified with the project's JWKS) ---
oma.supabase.url=${SUPABASE_URL}
oma.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# --- Alerts ---
oma.sms.server-channel-enabled=${OMA_SERVER_SMS_ENABLED:false}
oma.alerts.device-due-expiry=PT24H
oma.alerts.server-max-attempts=3
oma.alerts.server-retry-base-delay=PT1M
oma.alerts.send-lease=PT2M
oma.alerts.retention=P365D
oma.scheduler.poll-interval=PT15S

# --- Web / errors ---
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# --- API docs: off unless explicitly enabled ---
springdoc.api-docs.enabled=${OMA_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${OMA_API_DOCS_ENABLED:false}

# --- Actuator: only health is exposed ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
